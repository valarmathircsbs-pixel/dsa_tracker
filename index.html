<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>

    <h1>DSA Practice Tracker</h1>

    <!-- INPUT -->
    <input type="text" id="problemInput" placeholder="Enter problem name">

    <!-- DIFFICULTY -->
    <select id="difficultySelect">
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
    </select>

    <!-- TOPIC -->
    <select id="topicSelect">
        <option value="Arrays">Arrays</option>
        <option value="Strings">Strings</option>
        <option value="Trees">Trees</option>
        <option value="Graphs">Graphs</option>
    </select>

    <!-- ADD BUTTON -->
    <button id="addBtn">Add</button>

    <!-- SEARCH -->
    <input type="text" id="searchInput" placeholder="Search problems...">

    <!-- SORT -->
    <select id="sortSelect">
        <option value="default">Sort By</option>
        <option value="name">Name</option>
        <option value="difficulty">Difficulty</option>
        <option value="solved">Solved</option>
    </select>

    <!-- FILTERS -->
    <div class="filters">
        <button onclick="filterProblems(event,'All')">All</button>
        <button onclick="filterProblems(event,'Easy')">Easy</button>
        <button onclick="filterProblems(event,'Medium')">Medium</button>
        <button onclick="filterProblems(event,'Hard')">Hard</button>
    </div>

    <div class="filters">
        <button onclick="filterStatus(event,'All')">All</button>
        <button onclick="filterStatus(event,'Solved')">Solved</button>
        <button onclick="filterStatus(event,'Unsolved')">Unsolved</button>
    </div>

    <div class="filters">
        <button onclick="filterTopic(event,'All')">All Topics</button>
        <button onclick="filterTopic(event,'Arrays')">Arrays</button>
        <button onclick="filterTopic(event,'Strings')">Strings</button>
        <button onclick="filterTopic(event,'Trees')">Trees</button>
        <button onclick="filterTopic(event,'Graphs')">Graphs</button>
    </div>

    <!-- LIST -->
    <h2>Problems</h2>
    <p id="emptyMsg">No problems added yet</p>
    <ul id="problemList"></ul>

    <!-- STATS -->
    <h2>Stats</h2>
    <p>Total: <span id="totalCount">0</span></p>
    <p>Easy: <span id="easyCount">0</span></p>
    <p>Medium: <span id="mediumCount">0</span></p>
    <p>Hard: <span id="hardCount">0</span></p>

    <!-- PROGRESS -->
    <div class="progress-bar">
        <div id="progress"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
